<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Edukasi Lalu Lintas Indonesia</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            padding: 10px;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }
        h1 { font-size: 1.2rem; margin: 5px 0; text-align: center; }
        #instructions { font-size: 0.8rem; margin-bottom: 8px; text-align: center; color: #e0e0e0; max-width: 360px; }
        .menu-container, .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.95); }
        canvas {
            background-color: #333;
            border: 4px solid #f0a500;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
        }
        .panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 360px;
            margin-top: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- MENU UTAMA -->
    <div id="menuScreen" class="menu-container">
        <h1>Simulasi & Edukasi Lalu Lintas</h1>
        <p id="instructions">Pilih mode permainan sesuai aturan jalan raya Indonesia!</p>
        <button class="btn" onclick="startGame('simpang')">Simpang Empat (Pejalan Kaki)</button>
        <button class="btn" onclick="startGame('bundaran')">Bundaran Lalu Lintas</button>
    </div>

    <!-- AREA GAME -->
    <div id="gameScreen" class="game-container hidden">
        <h1 id="gameTitle">Simulasi Lalu Lintas</h1>
        <p id="gameInstructions">Ikuti aturan berlalu lintas!</p>
        
        <canvas id="gameCanvas" width="360" height="420"></canvas>
        
        <div class="panel">
            <div id="scoreBox">Skor: 0</div>
            <div id="lifeBox">Nyawa: 3</div>
            <div id="statusBox" style="color: #f0a500;">Status: Aman</div>
        </div>
        
        <button class="btn" id="actionBtn" style="padding: 10px 20px; margin-top: 10px;" onclick="handleAction()">AKSI</button>
        <button class="btn" style="background-color: #555; padding: 6px 12px; margin-top: 5px; font-size: 0.8rem;" onclick="returnToMenu()">Kembali ke Menu</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let currentMode = '';
    let score = 0;
    let lives = 3;
    let gameInterval = null;

    // Variabel Simpang Empat
    let trafficTimer = 0;
    let horizontalGreen = true; 
    let pedestrian = { x: 180, y: 370, radius: 10 };
    let carsSimpang = [
        { x: -50, y: 185, speed: 3, dir: 'right', type: 'horiz' },
        { x: 410, y: 215, speed: 3, dir: 'left', type: 'horiz' },
        { x: 165, y: -50, speed: 3, dir: 'down', type: 'vert' },
        { x: 195, y: 450, speed: 3, dir: 'up', type: 'vert' }
    ];

    // Variabel Bundaran
    let playerBundaran = { angle: Math.PI, speed: 0.04, active: false };
    let carsBundaran = [
        { angle: 0, speed: 0.03, color: '#e94560' },
        { angle: Math.PI / 2, speed: 0.03, color: '#0f3460' }
    ];

    function startGame(mode) {
        currentMode = mode;
        score = 0;
        lives = 3;
        document.getElementById('menuScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');

        if (mode === 'simpang') {
            document.getElementById('gameTitle').innerText = "Simpang Empat (Aturan Indonesia)";
            document.getElementById('gameInstructions').innerText = "Seberangkan pejalan kaki pada Zebra Cross saat lampu Vertikal Merah!";
            document.getElementById('actionBtn').innerText = "LANGKAH / JALAN";
            resetSimpang();
        } else {
            document.getElementById('gameTitle').innerText = "Simulasi Bundaran";
            document.getElementById('gameInstructions').innerText = "Tekan tombol untuk memutari bundaran dan hindari mobil lain!";
            document.getElementById('actionBtn').innerText = "PUTAR / JALAN";
            resetBundaran();
        }

        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(updateGame, 1000 / 30);
    }

    function returnToMenu() {
        clearInterval(gameInterval);
        document.getElementById('gameScreen').classList.add('hidden');
        document.getElementById('menuScreen').classList.remove('hidden');
    }

    function resetSimpang() {
        pedestrian.y = 370;
        trafficTimer = 0;
        horizontalGreen = true;
    }

    function resetBundaran() {
        playerBundaran.angle = Math.PI;
        playerBundaran.active = false;
    }

    function handleAction() {
        if (currentMode === 'simpang') {
            pedestrian.y -= 25;
            if (!horizontalGreen) {
                if (pedestrian.y < 40) {
                    score += 15;
                    resetSimpang();
                }
            } else {
                triggerGameOver("Pelanggaran! Menyeberang saat lampu jalur Vertikal Hijau!");
            }
        } else if (currentMode === 'bundaran') {
            playerBundaran.active = true;
        }
    }

    function updateGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (currentMode === 'simpang') {
            trafficTimer++;
            if (trafficTimer > 110) {
                horizontalGreen = !horizontalGreen;
                trafficTimer = 0;
            }

            // Render Jalan Simpang Empat
            ctx.fillStyle = '#444';
            ctx.fillRect(0, 160, 360, 100);
            ctx.fillRect(130, 0, 100, 420);

            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(0, 210); ctx.lineTo(360, 210);
            ctx.moveTo(180, 0); ctx.lineTo(180, 420);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#fff';
            for(let i = 140; i < 220; i += 12) {
                ctx.fillRect(i, 155, 6, 10);
                ctx.fillRect(i, 255, 6, 10);
            }

            carsSimpang.forEach(car => {
                let canMove = false;
                if (car.type === 'horiz' && horizontalGreen) canMove = true;
                if (car.type === 'vert' && !horizontalGreen) canMove = true;

                if (canMove) {
                    if (car.dir === 'right') { car.x += car.speed; if (car.x > 400) car.x = -50; }
                    if (car.dir === 'left') { car.x -= car.speed; if (car.x < -50) car.x = 400; }
                    if (car.dir === 'down') { car.y += car.speed; if (car.y > 450) car.y = -50; }
                    if (car.dir === 'up') { car.y -= car.speed; if (car.y < -50) car.y = 450; }
                }

                ctx.fillStyle = car.dir === 'right' || car.dir === 'down' ? '#ff4757' : '#2e86de';
                if (car.type === 'horiz') {
                    ctx.fillRect(car.x, car.y, 35, 16);
                } else {
                    ctx.fillRect(car.x, car.y, 16, 35);
                }

                let hitW = car.type === 'horiz' ? 35 : 16;
                let hitH = car.type === 'horiz' ? 16 : 35;
                if (pedestrian.x > car.x && pedestrian.x < car.x + hitW &&
                    pedestrian.y > car.y && pedestrian.y < car.y + hitH) {
                    triggerGameOver("Tertabrak kendaraan!");
                }
            });

            ctx.beginPath();
            ctx.arc(pedestrian.x, pedestrian.y, pedestrian.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffa502';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = '10px sans-serif';
            ctx.fillText('P', pedestrian.x - 3, pedestrian.y + 3);

            document.getElementById('statusBox').innerText = horizontalGreen ? "Vertikal MERAH" : "Vertikal HIJAU";

        } else if (currentMode === 'bundaran') {
            // Render Jalan Bundaran
            ctx.fillStyle = '#444';
            ctx.fillRect(0, 140, 360, 140);
            ctx.fillRect(110, 0, 140, 420);

            let centerX = 180, centerY = 210, radius = 55;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#2ed573';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#f0a500';
            ctx.stroke();

            ctx.strokeStyle = '#fff';
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 20, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);

            let orbitRadius = radius + 20;
            carsBundaran.forEach(c => {
                c.angle += c.speed;
                let cx = centerX + Math.cos(c.angle) * orbitRadius;
                let cy = centerY + Math.sin(c.angle) * orbitRadius;

                ctx.beginPath();
                ctx.arc(cx, cy, 10, 0, Math.PI * 2);
                ctx.fillStyle = c.color;
                ctx.fill();

                if (playerBundaran.active) {
                    let px = centerX + Math.cos(playerBundaran.angle) * orbitRadius;
                    let py = centerY + Math.sin(playerBundaran.angle) * orbitRadius;
                    if (Math.hypot(px - cx, py - cy) < 18) {
                        triggerGameOver("Menabrak kendaraan lain saat memutari bundaran!");
                    }
                }
            });

            if (playerBundaran.active) {
                playerBundaran.angle += playerBundaran.speed;
                if (playerBundaran.angle > Math.PI * 3) {
                    score += 25;
                    resetBundaran();
                }
            }

            let pX = centerX + Math.cos(playerBundaran.angle) * orbitRadius;
            let pY = centerY + Math.sin(playerBundaran.angle) * orbitRadius;

            ctx.beginPath();
            ctx.arc(pX, pY, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#ff4757';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = '9px sans-serif';
            ctx.fillText('ANDA', pX - 12, pY - 14);

            document.getElementById('statusBox').innerText = playerBundaran.active ? "Memutar Bundaran..." : "Tekan Putar";
        }

        document.getElementById('scoreBox').innerText = "Skor: " + score;
        document.getElementById('lifeBox').innerText = "Nyawa: " + lives;
    }

    function triggerGameOver(reason) {
        lives--;
        if (lives <= 0) {
            alert("PERMAINAN SELESAI!\nSkor Akhir: " + score + "\nAlasan: " + reason);
            returnToMenu();
        } else {
            alert("PELANGGARAN!\n" + reason + "\nSisa Nyawa: " + lives);
            if (currentMode === 'simpang') resetSimpang();
            else resetBundaran();
        }
    }
</script>

</body>
</html>
