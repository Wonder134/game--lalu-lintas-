<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Edukasi Lalu Lintas: Simpang Empat & Bundaran</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            padding: 10px;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }
        h1 { font-size: 1.2rem; margin: 5px 0; text-align: center; }
        #instructions { font-size: 0.8rem; margin-bottom: 8px; text-align: center; color: #e0e0e0; max-width: 360px; }
        .menu-container, .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.95); }
        canvas {
            background-color: #333;
            border: 4px solid #f0a500;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
        }
        .panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 360px;
            margin-top: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- MENU UTAMA -->
    <div id="menuScreen" class="menu-container">
        <h1>Simulasi & Edukasi Lalu Lintas</h1>
        <p id="instructions">Pilih mode permainan yang ingin dimainkan!</p>
        <button class="btn" onclick="startGame('simpang')">Simpang Empat (Pejalan Kaki)</button>
        <button class="btn" onclick="startGame('bundaran')">Bundaran Lalu Lintas (Kendaraan)</button>
    </div>

    <!-- AREA GAME -->
    <div id="gameScreen" class="game-container hidden">
        <h1 id="gameTitle">Simulasi Lalu Lintas</h1>
        <p id="gameInstructions">Seberangkan pejalan kaki saat lampu Merah!</p>
        
        <canvas id="gameCanvas" width="360" height="420"></canvas>
        
        <div class="panel">
            <div id="scoreBox">Skor: 0</div>
            <div id="lifeBox">Nyawa: 3</div>
            <div id="statusBox" style="color: #f0a500;">Status: Aman</div>
        </div>
        
        <button class="btn" id="actionBtn" style="padding: 10px 20px; margin-top: 10px;" onclick="handleAction()">GERAKKAN / MAJU</button>
        <button class="btn" style="background-color: #555; padding: 6px 12px; margin-top: 5px; font-size: 0.8rem;" onclick="returnToMenu()">Kembali ke Menu</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let currentMode = '';
    let score = 0;
    let lives = 3;
    let gameInterval = null;

    // Variabel Simpang Empat (Lampu horizontal & vertikal terpisah)
    let trafficTimer = 0;
    let horizontalGreen = true; // True = Arah Kiri/Kanan Hijau, False = Arah Atas/Bawah Hijau
    let pedestrian = { x: 180, y: 370, radius: 10 };
    
    let carsSimpang = [
        { x: -50, y: 175, speed: 3, dir: 'right', type: 'horiz' },
        { x: 410, y: 225, speed: 3, dir: 'left', type: 'horiz' },
        { x: 155, y: -50, speed: 3, dir: 'down', type: 'vert' },
        { x: 205, y: 450, speed: 3, dir: 'up', type: 'vert' }
    ];

    // Variabel Bundaran
    let carsBundaran = [
        { x: 180, y: -30, vx: 0, vy: 2.5, radius: 12, color: '#e94560' },
        { x: 390, y: 210, vx: -2.5, vy: 0, radius: 12, color: '#0f3460' },
        { x: 180, y: 450, vx: 0, vy: -2.5, radius: 12, color: '#f0a500' }
    ];
    let playerCar = { x: 30, y: 210, speed: 3.5, active: false };

    function startGame(mode) {
        currentMode = mode;
        score = 0;
        lives = 3;
        document.getElementById('menuScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');

        if (mode === 'simpang') {
            document.getElementById('gameTitle').innerText = "Simulasi Simpang Empat";
            document.getElementById('gameInstructions').innerText = "Seberangkan pejalan kaki saat jalur vertikal MERAH!";
            document.getElementById('actionBtn').innerText = "LANGKAH / MAJU";
            resetSimpang();
        } else {
            document.getElementById('gameTitle').innerText = "Simulasi Bundaran";
            document.getElementById('gameInstructions').innerText = "Lewati bundaran tanpa menabrak mobil lain!";
            document.getElementById('actionBtn').innerText = "MAJU / GAS";
            resetBundaran();
        }

        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(updateGame, 1000 / 30);
    }

    function returnToMenu() {
        clearInterval(gameInterval);
        document.getElementById('gameScreen').classList.add('hidden');
        document.getElementById('menuScreen').classList.remove('hidden');
    }

    function resetSimpang() {
        pedestrian.y = 370;
        trafficTimer = 0;
        horizontalGreen = true;
    }

    function resetBundaran() {
        playerCar.x = 30;
        playerCar.y = 210;
        playerCar.active = false;
    }

    function handleAction() {
        if (currentMode === 'simpang') {
            pedestrian.y -= 25;
            // Jalur vertikal (atas-bawah) bersinggungan langsung dengan jalur penyeberangan pejalan kaki
            if (horizontalGreen) {
                // Jika horizontal hijau, berarti vertikal merah (aman untuk menyeberang vertikal)
                if (pedestrian.y < 40) {
                    score += 10;
                    resetSimpang();
                }
            } else {
                // Jika vertikal hijau, pejalan kaki tidak boleh menyeberang karena mobil dari atas/bawah jalan
                triggerGameOver("Tertabrak! Menyeberang saat lampu jalur Vertikal Hijau!");
            }
        } else if (currentMode === 'bundaran') {
            playerCar.active = true;
        }
    }

    function updateGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (currentMode === 'simpang') {
            // Berganti lampu secara berkala
            trafficTimer++;
            if (trafficTimer > 100) {
                horizontalGreen = !horizontalGreen;
                trafficTimer = 0;
            }

            // Gambar Jalan Simpang Empat
            ctx.fillStyle = '#444';
            ctx.fillRect(0, 160, 360, 100);
            ctx.fillRect(130, 0, 100, 420);

            // Garis jalan
            ctx.strokeStyle = '#fff';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, 210); ctx.lineTo(360, 210);
            ctx.moveTo(180, 0); ctx.lineTo(180, 420);
            ctx.stroke();
            ctx.setLineDash([]);

            // Lampu Lalu Lintas Horizontal (Atas/Kiri) & Vertikal
            // Lampu Horizontal
            ctx.fillStyle = horizontalGreen ? '#2ed573' : '#ff4757';
            ctx.beginPath(); ctx.arc(100, 145, 6, 0, Math.PI * 2); ctx.fill();
            // Lampu Vertikal
            ctx.fillStyle = !horizontalGreen ? '#2ed573' : '#ff4757';
            ctx.beginPath(); ctx.arc(215, 145, 6, 0, Math.PI * 2); ctx.fill();

            // Gerakkan Mobil
            carsSimpang.forEach(car => {
                let canMove = false;
                if (car.type === 'horiz' && horizontalGreen) canMove = true;
                if (car.type === 'vert' && !horizontalGreen) canMove = true;

                if (canMove) {
                    if (car.dir === 'right') { car.x += car.speed; if (car.x > 400) car.x = -50; }
                    if (car.dir === 'left') { car.x -= car.speed; if (car.x < -50) car.x = 400; }
                    if (car.dir === 'down') { car.y += car.speed; if (car.y > 450) car.y = -50; }
                    if (car.dir === 'up') { car.y -= car.speed; if (car.y < -50) car.y = 450; }
                }

                // Gambar Mobil
                ctx.fillStyle = car.type === 'horiz' ? '#ff6b81' : '#70a1ff';
                if (car.type === 'horiz') {
                    ctx.fillRect(car.x, car.y, 40, 20);
                } else {
                    ctx.fillRect(car.x, car.y, 20, 40);
                }

                // Cek Tabrakan Pejalan Kaki dengan Mobil
                let hitBoxW = car.type === 'horiz' ? 40 : 20;
                let hitBoxH = car.type === 'horiz' ? 20 : 40;
                if (pedestrian.x > car.x && pedestrian.x < car.x + hitBoxW &&
                    pedestrian.y > car.y && pedestrian.y < car.y + hitBoxH) {
                    triggerGameOver("Tertabrak mobil yang melintas!");
                }
            });

            // Gambar Pejalan Kaki (P)
            ctx.beginPath();
            ctx.arc(pedestrian.x, pedestrian.y, pedestrian.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffa502';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = '10px sans-serif';
            ctx.fillText('P', pedestrian.x - 3, pedestrian.y + 3);

            document.getElementById('statusBox').innerText = horizontalGreen ? "Vertikal: MERAH" : "Vertikal: HIJAU";

        } else if (currentMode === 'bundaran') {
            // Gambar Bundaran di Tengah
            ctx.fillStyle = '#444';
            ctx.fillRect(0, 140, 360, 140);
            ctx.fillRect(110, 0, 140, 420);

            ctx.beginPath();
            ctx.arc(180, 210, 50, 0, Math.PI * 2);
            ctx.fillStyle = '#2ed573';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#f0a500';
            ctx.stroke();

            carsBundaran.forEach(c => {
                c.x += c.vx;
                c.y += c.vy;
                if (c.x < 100 || c.x > 260) c.vx *= -1;
                if (c.y < 100 || c.y > 320) c.vy *= -1;

                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                ctx.fillStyle = c.color;
                ctx.fill();

                if (playerCar.active && Math.hypot(playerCar.x - c.x, playerCar.y - c.y) < 20) {
                    triggerGameOver("Menabrak kendaraan di bundaran!");
                }
            });

            if (playerCar.active) {
                playerCar.x += playerCar.speed;
                if (playerCar.x > 380) {
                    score += 20;
                    resetBundaran();
                }
            }

            ctx.fillStyle = '#ff4757';
            ctx.fillRect(playerCar.x - 15, playerCar.y - 10, 30, 20);
            ctx.fillStyle = '#fff';
            ctx.font = '10px sans-serif';
            ctx.fillText('ANDA', playerCar.x - 15, playerCar.y - 15);

            document.getElementById('statusBox').innerText = playerCar.active ? "Melaju..." : "Tekan Gas";
        }

        document.getElementById('scoreBox').innerText = "Skor: " + score;
        document.getElementById('lifeBox').innerText = "Nyawa: " + lives;
    }

    function triggerGameOver(reason) {
        lives--;
        if (lives <= 0) {
            alert("PERMAINAN USAI! Skor Akhir Anda: " + score + "\nAlasan: " + reason);
            returnToMenu();
        } else {
            alert("Peringatan! " + reason + "\nSisa Nyawa: " + lives);
            if (currentMode === 'simpang') resetSimpang();
            else resetBundaran();
        }
    }
</script>

</body>
</html>
